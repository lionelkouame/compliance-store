api_platform:
    title: Compliance Store API
    version: 1.0.0
    description: Open-source REST API for regulatory compliance, zero-trust envelope encryption, and sensitive document storage lifecycle.
    enable_swagger_ui: true
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        multipart: ['multipart/form-data']
    mapping:
        paths:
            - '%kernel.project_dir%/src/Infrastructure/Presentation/ApiPlatform/V1/Resource'
    # Business exceptions (src/Domain/Exception) are translated into HTTP once,
    # here, by category: processors and providers never catch them.
    # Setting this key replaces API Platform's defaults, hence the first three entries.
    exception_to_status:
        Symfony\Component\Serializer\Exception\ExceptionInterface: 400
        ApiPlatform\Metadata\Exception\InvalidArgumentException: 400
        Doctrine\ORM\OptimisticLockException: 409
        App\Domain\Exception\NotFoundException: 404
        App\Domain\Exception\AlreadyExistException: 409
        App\Domain\Exception\InvalidDataException: 422
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
