api_platform:
    title: Compliance Store API
    version: 1.0.0
    description: Open-source REST API for regulatory compliance, zero-trust envelope encryption, and sensitive document storage lifecycle.
    enable_swagger_ui: true
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    mapping:
        paths:
            - '%kernel.project_dir%/src/Infrastructure/ApiPlatform/Resource'
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    exception_to_status:
        App\Domain\Exception\InvalidRegulatoryScopeException: 422
        App\Domain\Exception\RegulatoryScopeAlreadyExistsException: 409
        App\Domain\Exception\NonCompliantDocumentException: 422
        App\Domain\Exception\InvalidJurisdictionException: 422
        App\Domain\Exception\JurisdictionAlreadyExistsException: 409
        App\Domain\Exception\InvalidLegalFrameworkException: 422
        App\Domain\Exception\LegalFrameworkAlreadyExistsException: 409
