doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        types:
            regulatory_scope_id:
                class: App\Infrastructure\Persistence\Doctrine\Type\RegulatoryScopeIdType
            regulatory_scope_code:
                class: App\Infrastructure\Persistence\Doctrine\Type\RegulatoryScopeCodeType
            regulatory_scope_label:
                class: App\Infrastructure\Persistence\Doctrine\Type\RegulatoryScopeLabelType
            regulatory_scope_description:
                class: App\Infrastructure\Persistence\Doctrine\Type\RegulatoryScopeDescriptionType
            allowed_document_types:
                class: App\Infrastructure\Persistence\Doctrine\Type\AllowedDocumentTypesType
            document_id:
                class: App\Infrastructure\Persistence\Doctrine\Type\DocumentIdType
            owner_id:
                class: App\Infrastructure\Persistence\Doctrine\Type\OwnerIdType
            document_type:
                class: App\Infrastructure\Persistence\Doctrine\Type\DocumentTypeType
            file_hash:
                class: App\Infrastructure\Persistence\Doctrine\Type\FileHashType
            storage_key:
                class: App\Infrastructure\Persistence\Doctrine\Type\StorageKeyType
            wrapped_data_key:
                class: App\Infrastructure\Persistence\Doctrine\Type\WrappedDataKeyType
            document_metadata:
                class: App\Infrastructure\Persistence\Doctrine\Type\DocumentMetadataType
            jurisdiction_id:
                class: App\Infrastructure\Persistence\Doctrine\Type\JurisdictionIdType
            jurisdiction_code:
                class: App\Infrastructure\Persistence\Doctrine\Type\JurisdictionCodeType
            jurisdiction_label:
                class: App\Infrastructure\Persistence\Doctrine\Type\JurisdictionLabelType
            jurisdiction_region:
                class: App\Infrastructure\Persistence\Doctrine\Type\JurisdictionRegionType
            jurisdiction_country:
                class: App\Infrastructure\Persistence\Doctrine\Type\JurisdictionCountryType
            jurisdiction_sub_region:
                class: App\Infrastructure\Persistence\Doctrine\Type\JurisdictionSubRegionType
            applicable_frameworks:
                class: App\Infrastructure\Persistence\Doctrine\Type\ApplicableFrameworksType
            legal_framework_id:
                class: App\Infrastructure\Persistence\Doctrine\Type\LegalFrameworkIdType
            legal_framework_code:
                class: App\Infrastructure\Persistence\Doctrine\Type\LegalFrameworkCodeType
            legal_framework_name:
                class: App\Infrastructure\Persistence\Doctrine\Type\LegalFrameworkNameType
            legal_framework_official_reference:
                class: App\Infrastructure\Persistence\Doctrine\Type\LegalFrameworkOfficialReferenceType
            legal_framework_regulatory_authority:
                class: App\Infrastructure\Persistence\Doctrine\Type\LegalFrameworkRegulatoryAuthorityType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Domain\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
