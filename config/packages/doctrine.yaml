doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        types:
            regulatory_scope_id:
                class: App\Infrastructure\Persistence\Type\RegulatoryScopeIdType
            regulatory_scope_code:
                class: App\Infrastructure\Persistence\Type\RegulatoryScopeCodeType
            regulatory_scope_label:
                class: App\Infrastructure\Persistence\Type\RegulatoryScopeLabelType
            regulatory_scope_description:
                class: App\Infrastructure\Persistence\Type\RegulatoryScopeDescriptionType
            allowed_document_types:
                class: App\Infrastructure\Persistence\Type\AllowedDocumentTypesType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Persistence/Mapping'
                prefix: 'App\Domain\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
