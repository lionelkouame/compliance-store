# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Application version reported by /api/v1/health; override with APP_VERSION.
    env(APP_VERSION): '1.0.0'
    app.version: '%env(APP_VERSION)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # S3-compatible client used by MinioStorageGateway (documents.storage, see flysystem.yaml).
    Aws\S3\S3Client:
        arguments:
            -
                endpoint: '%env(AWS_S3_ENDPOINT)%'
                region: 'us-east-1'
                version: 'latest'
                use_path_style_endpoint: true
                credentials:
                    key: '%env(AWS_S3_ACCESS_KEY)%'
                    secret: '%env(AWS_S3_SECRET_KEY)%'

    App\Infrastructure\Storage\MinioStorageGateway:
        arguments:
            $documentsStorage: '@documents.storage'

    App\Application\UseCase\System\CheckSystemStatus\CheckSystemStatusUseCase:
        arguments:
            $environment: '%kernel.environment%'
            $version: '%app.version%'

    App\Infrastructure\Gateway\SodiumCipherGateway:
        arguments:
            $masterKey: '%env(base64:DOCUMENT_MASTER_KEY)%'

when@test:
    services:
        # No Monolog bundle is installed: the framework's fallback logger
        # (Symfony\Component\HttpKernel\Log\Logger) writes every log record to
        # stderr unconditionally, including expected/handled exceptions from
        # negative-path tests (404, 409, 422...). Silence it in tests only.
        logger:
            class: Psr\Log\NullLogger
